<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>补货预测工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><span>本地分析应用</span><h1>补货预测工作台</h1><p id="description"></p></header>
<main>
<form id="filters"><label>分析时点 <input name="cutoff" type="number" required></label><label>业务范围 <select name="group"></select></label><button type="submit">更新分析</button></form>

<section aria-label="历史浏览"><h2>历史浏览</h2><p id="status" role="status">正在读取资料</p><dl id="summary"></dl><ul id="notes"></ul><p id="digest"></p><div id="results" class="scroll"></div></section>

<section aria-label="补货预测">
<h2>补货预测</h2>
<p class="hint">按分析时点向前看，品类、区域与总层点值可加；区间按回测残差相关性合成，不是逐序列端点相加。</p>
<form id="forecast">
<label>预测步长 <input name="horizon" type="number" min="1" max="8" value="4" required></label>
<label>替代旧品 <select name="from"></select></label>
<label>替代新品 <select name="to"></select></label>
<label>替代比例 <input name="share" type="number" min="0.05" max="1" step="0.05" value="1"></label>
<button type="submit">更新预测</button>
</form>
<p id="forecast-status" role="status">预测尚未更新</p>
<dl id="forecast-summary"></dl>
<ul id="forecast-notes"></ul>
<h3>层级计划</h3><div id="levels" class="scroll"></div>
<h3>逐序列预测</h3><div id="series" class="scroll"></div>
<h3>替代情景</h3><div id="scenario" class="scroll"></div><ul id="scenario-notes"></ul>
<form id="save-forecast"><label>版本名称 <input name="title" required maxlength="100" value="补货讨论"></label><button type="submit">保存当前预测</button></form>
</section>

<section aria-label="保存的分析"><h2>分析版本</h2><form id="save"><label>版本名称 <input name="title" required maxlength="100" value="经营讨论"></label><button type="submit">保存当前分析</button></form><ul id="history"></ul></section>

<section aria-label="原始资料"><h2>资料查阅</h2><label>资料表 <select id="tables"></select></label><button id="source" type="button">查看资料</button><div id="raw" class="scroll"></div></section>
</main><script src="/app.js" defer></script>
</body></html>
